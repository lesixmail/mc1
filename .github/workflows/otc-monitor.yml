# OTC 市场监控: 周期抓取 6 大交易所 P2P/OTC 盘口并发布到 GitHub Pages
#
# 运行模型:
#   - 每次运行内部循环 N 轮 (默认 11 轮 x 5 分钟 ≈ 55 分钟), 结束时自动再次派发自己,
#     从而实现 7x24 持续监控 (将 otc/AUTORUN 改为 off 即停止续期)。
#   - schedule 触发器是看门狗 (workflow 合并到默认分支后生效), 链条意外中断时自动拉起。
name: OTC Monitor

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "本次运行抓取轮数 (每轮间隔 5 分钟)"
        default: "11"
      probe:
        description: "探测模式: 打印交易所原始响应 (true/false)"
        default: "false"
  push:
    branches: [claude/otc-market-monitor-xjsjiy]
    paths: ["otc/**", ".github/workflows/otc-monitor.yml"]
  schedule:
    - cron: "17,47 * * * *"

env:
  # 监控代码所在分支 (调度入口可能在 main, 实际代码固定从这里取)
  MONITOR_REF: claude/otc-market-monitor-xjsjiy

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: otc-monitor
  cancel-in-progress: true

jobs:
  # 站点发布: 仅在 main 引用的运行 (schedule / 对 main 的 dispatch) 中执行,
  # 因为 github-pages 环境的保护规则只放行默认分支的部署。
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages 站点首次创建需要管理员在 Settings → Pages 选择 "GitHub Actions" 源;
    # 开通前此 job 会失败, 不应拖垮监控链
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MONITOR_REF }}
      - name: Bundle site with latest data snapshot
        run: |
          mkdir -p otc/site/data
          git fetch -q --depth 1 origin otc-data || true
          git show origin/otc-data:latest.json  > otc/site/data/latest.json  2>/dev/null || echo '{}' > otc/site/data/latest.json
          git show origin/otc-data:history.json > otc/site/data/history.json 2>/dev/null || echo '{}' > otc/site/data/history.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: otc/site
      - id: deployment
        uses: actions/deploy-pages@v4

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MONITOR_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip -q install requests

      - name: Run monitor loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE: ${{ inputs.probe == 'true' && '1' || '' }}
        run: bash otc/scripts/run_loop.sh "${{ inputs.cycles || '11' }}" 300

      - name: Self re-dispatch (持续运行)
        # 取消运行时不续期 (手动取消即可停链, 看门狗 cron 会按需拉起)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(tr -d '[:space:]' < otc/AUTORUN 2>/dev/null || echo off)
          if [ "$state" = "on" ]; then
            echo "续期下一轮运行"
            gh workflow run otc-monitor.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
              || gh workflow run otc-monitor.yml --ref "${MONITOR_REF}" -R "${GITHUB_REPOSITORY}" \
              || echo "续期失败 (等待 schedule 看门狗拉起)"
          else
            echo "AUTORUN=$state, 停止自动续期"
          fi
